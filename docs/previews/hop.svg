<svg id="clawd-hop" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd hopping"><style>#clawd-hop *{transform-box:fill-box} #clawd-hop .squash,#clawd-hop .tilt,#clawd-hop .jumper{transform-origin:50% 100%} #clawd-hop .leg{transform-origin:50% 0%} #clawd-hop .blink,#clawd-hop .look,#clawd-hop .flip,#clawd-hop .shadowg,#clawd-hop .fxc{transform-origin:50% 50%} #clawd-hop .armL{transform-origin:100% 50%} #clawd-hop .armR{transform-origin:0% 50%} #clawd-hop .eyes-h,#clawd-hop .eyes-c,#clawd-hop .eyes-w,#clawd-hop .eyes-s{opacity:0} #clawd-hop .blink{animation:hop-bk calc(2.8s / var(--speed, 1)) infinite} @keyframes hop-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-hop .jumper{animation:hop-j calc(1.4s / var(--speed, 1)) infinite} #clawd-hop .squash{animation:hop-sq calc(1.4s / var(--speed, 1)) infinite} #clawd-hop .leg{animation:hop-lg calc(1.4s / var(--speed, 1)) infinite} #clawd-hop .armL,#clawd-hop .armR{animation:hop-ar calc(1.4s / var(--speed, 1)) infinite} #clawd-hop .shadowg{animation:hop-sh calc(1.4s / var(--speed, 1)) infinite} #clawd-hop .dust{opacity:0;animation:hop-ds calc(1.4s / var(--speed, 1)) ease-out infinite} #clawd-hop .pl{--dx:-3px} #clawd-hop .pr{--dx:3px} @keyframes hop-j{0%,15%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}42%{transform:translateY(-7px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}68%,100%{transform:translateY(0)}} @keyframes hop-sq{0%{transform:scale(1,1)}12%{transform:scale(1.16,.8)}22%{transform:scale(.9,1.14)}42%,64%{transform:scale(1,1)}72%{transform:scale(1.18,.78)}84%{transform:scale(.97,1.04)}100%{transform:scale(1,1)}} @keyframes hop-lg{0%,18%,70%,100%{transform:scaleY(1)}26%,62%{transform:scaleY(.5)}} @keyframes hop-ar{0%,18%,68%,100%{transform:translateY(0)}30%,58%{transform:translateY(-2px)}} @keyframes hop-sh{0%,15%,68%,100%{transform:scaleX(1);opacity:1}42%{transform:scaleX(.5);opacity:.45}} @keyframes hop-ds{0%,68%{opacity:0;transform:translateX(0) scale(.5)}72%{opacity:.9}95%,100%{opacity:0;transform:translateX(var(--dx)) scale(1.4)}} #clawd-hop .enter{transform-origin:50% 100%;animation:hop-in .4s ease-out both} #clawd-hop .pin{transform-origin:50% 50%;animation:hop-pin .45s ease-out both} @keyframes hop-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes hop-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}} </style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><g class="dust pl" style=""><rect x="9" y="17" width="2" height="1" fill="#BDB6AE"/><rect x="9.5" y="16" width="1" height="1" fill="#BDB6AE"/></g><g class="dust pr" style=""><rect x="21" y="17" width="2" height="1" fill="#BDB6AE"/><rect x="21.5" y="16" width="1" height="1" fill="#BDB6AE"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> </g></g> </g> </g></g></g></svg>