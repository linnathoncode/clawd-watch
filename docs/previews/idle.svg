<svg id="clawd-idle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd idle"><style>#clawd-idle *{transform-box:fill-box} #clawd-idle .squash,#clawd-idle .tilt,#clawd-idle .jumper{transform-origin:50% 100%} #clawd-idle .leg{transform-origin:50% 0%} #clawd-idle .blink,#clawd-idle .look,#clawd-idle .flip,#clawd-idle .shadowg,#clawd-idle .fxc{transform-origin:50% 50%} #clawd-idle .armL{transform-origin:100% 50%} #clawd-idle .armR{transform-origin:0% 50%} #clawd-idle .eyes-h,#clawd-idle .eyes-c,#clawd-idle .eyes-w,#clawd-idle .eyes-s{opacity:0} #clawd-idle .blink{animation:idle-bk calc(4s / var(--speed, 1)) infinite} @keyframes idle-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-idle .squash{animation:idle-br calc(2.4s / var(--speed, 1)) ease-in-out infinite} #clawd-idle .look{animation:idle-lk calc(7s / var(--speed, 1)) infinite} #clawd-idle .tilt{animation:idle-tl calc(7s / var(--speed, 1)) ease-in-out infinite} #clawd-idle .armR{animation:idle-sc calc(7s / var(--speed, 1)) infinite} #clawd-idle .eyes-n{animation:idle-en calc(7s / var(--speed, 1)) steps(1) infinite} #clawd-idle .eyes-c{animation:idle-ec calc(7s / var(--speed, 1)) steps(1) infinite} #clawd-idle .itch{opacity:0;animation:idle-it calc(7s / var(--speed, 1)) steps(1) infinite} #clawd-idle .l4{animation:idle-tp calc(7s / var(--speed, 1)) infinite} @keyframes idle-br{0%,100%{transform:scale(1,1)}50%{transform:scale(.98,1.05)}} @keyframes idle-lk{0%,14%,40%,100%{transform:translateX(0)}18%,26%{transform:translateX(-1px)}30%,36%{transform:translate(1px,-1px)}} @keyframes idle-tl{0%,50%,82%,100%{transform:rotate(0)}56%,76%{transform:rotate(-5deg)}} @keyframes idle-sc{0%,50%,82%,100%{transform:translate(0,0)}56%,60%,64%,68%,72%,76%{transform:translate(-1px,-4px)}58%,62%,66%,70%,74%{transform:translate(-2px,-5px)}} @keyframes idle-en{0%,57.9%{opacity:1}58%,75.9%{opacity:0}76%,100%{opacity:1}} @keyframes idle-ec{0%,57.9%{opacity:0}58%,75.9%{opacity:1}76%,100%{opacity:0}} @keyframes idle-it{0%,57.9%{opacity:0}58%,59.9%,62%,63.9%,66%,67.9%,70%,71.9%{opacity:1}60%,61.9%,64%,65.9%,68%,69.9%,72%,100%{opacity:0}} @keyframes idle-tp{0%,84%,100%{transform:translateY(0)}87%,93%{transform:translateY(-1px)}90%,96%{transform:translateY(0)}} #clawd-idle .enter{transform-origin:50% 100%;animation:idle-in .4s ease-out both} #clawd-idle .pin{transform-origin:50% 50%;animation:idle-pin .45s ease-out both} @keyframes idle-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes idle-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}}</style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><g class="itch"><rect x="21" y="7" width="1" height="1" fill="#D97757"/><rect x="23" y="8" width="1" height="1" fill="#D97757"/><rect x="22" y="6" width="1" height="1" fill="#D97757"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> </g></g> </g> </g></g></g></svg>