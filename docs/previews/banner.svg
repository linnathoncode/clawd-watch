<svg id="clawd-sleeping" x="16" y="12" width="104" height="72" viewBox="0 0 32 22" shape-rendering="crispEdges"><style>#clawd-sleeping *{transform-box:fill-box} #clawd-sleeping .squash,#clawd-sleeping .tilt,#clawd-sleeping .jumper{transform-origin:50% 100%} #clawd-sleeping .leg{transform-origin:50% 0%} #clawd-sleeping .blink,#clawd-sleeping .look,#clawd-sleeping .flip,#clawd-sleeping .shadowg,#clawd-sleeping .fxc{transform-origin:50% 50%} #clawd-sleeping .armL{transform-origin:100% 50%} #clawd-sleeping .armR{transform-origin:0% 50%} #clawd-sleeping .eyes-h,#clawd-sleeping .eyes-c,#clawd-sleeping .eyes-w,#clawd-sleeping .eyes-s{opacity:0} #clawd-sleeping .eyes-n{opacity:0} #clawd-sleeping .eyes-c{opacity:1} #clawd-sleeping .jumper{transform:translateY(1px)} #clawd-sleeping .leg{transform:scaleY(.5)} #clawd-sleeping .tilt{transform:rotate(-4deg)} #clawd-sleeping .squash{animation:sleeping-br calc(3.2s / var(--speed, 1)) ease-in-out infinite} #clawd-sleeping .eyes-c{animation:sleeping-ed calc(3.2s / var(--speed, 1)) ease-in-out infinite} #clawd-sleeping .shadowg{animation:sleeping-sh calc(3.2s / var(--speed, 1)) ease-in-out infinite} #clawd-sleeping .bub{transform-origin:50% 0%;animation:sleeping-bu calc(3.2s / var(--speed, 1)) ease-in-out infinite} #clawd-sleeping .zz{opacity:0;animation:sleeping-z calc(3.2s / var(--speed, 1)) ease-out infinite} #clawd-sleeping .z1{animation-delay:calc(1.6s / var(--speed, 1))} @keyframes sleeping-br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,1.08)}} @keyframes sleeping-sh{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.06)}} @keyframes sleeping-ed{0%,100%{transform:translateY(1px)}40%,60%{transform:translateY(0)}} @keyframes sleeping-bu{0%{transform:scale(0);opacity:.8}50%{transform:scale(2.6);opacity:.8}54%{transform:scale(3.2);opacity:0}100%{transform:scale(0);opacity:0}} @keyframes sleeping-z{0%{opacity:0;transform:translate(0,2px) scale(.6)}20%{opacity:1}50%{transform:translate(2px,-2px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(0,-5px) scale(1.1)}} #clawd-sleeping .pin{transform-origin:50% 50%;animation:sleeping-pin .45s ease-out both} @keyframes sleeping-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes sleeping-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}} #clawd-sleeping .jumper{animation:sleeping-a0 450ms ease-out both} @keyframes sleeping-a0{from{transform:none}to{transform:translateY(1px)}} #clawd-sleeping .leg{animation:sleeping-a1 450ms ease-out both} @keyframes sleeping-a1{from{transform:none}to{transform:scaleY(.5)}} #clawd-sleeping .tilt{animation:sleeping-a2 450ms ease-out both} @keyframes sleeping-a2{from{transform:none}to{transform:rotate(-4deg)}}</style><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><g class="zz z0"><rect x="23" y="8" width="3" height="1" fill="#D97757"/><rect x="24" y="9" width="1" height="1" fill="#D97757"/><rect x="23" y="10" width="3" height="1" fill="#D97757"/></g><g class="zz z1"><rect x="25" y="3" width="4" height="1" fill="#D97757"/><rect x="27" y="4" width="1" height="1" fill="#D97757"/><rect x="26" y="5" width="1" height="1" fill="#D97757"/><rect x="25" y="6" width="4" height="1" fill="#D97757"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9"