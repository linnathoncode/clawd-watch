<svg id="clawd-scrolling" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd doom scrolling"><style>#clawd-scrolling *{transform-box:fill-box} #clawd-scrolling .squash,#clawd-scrolling .tilt,#clawd-scrolling .jumper{transform-origin:50% 100%} #clawd-scrolling .leg{transform-origin:50% 0%} #clawd-scrolling .blink,#clawd-scrolling .look,#clawd-scrolling .flip,#clawd-scrolling .shadowg,#clawd-scrolling .fxc{transform-origin:50% 50%} #clawd-scrolling .armL{transform-origin:100% 50%} #clawd-scrolling .armR{transform-origin:0% 50%} #clawd-scrolling .eyes-h,#clawd-scrolling .eyes-c,#clawd-scrolling .eyes-w,#clawd-scrolling .eyes-s{opacity:0} #clawd-scrolling .blink{animation:scrolling-bk calc(5s / var(--speed, 1)) infinite} @keyframes scrolling-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-scrolling .look{transform:translateY(1px)} #clawd-scrolling .armL{transform:translate(3px,2px)} #clawd-scrolling .armR{animation:scrolling-th calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-scrolling .squash{animation:scrolling-br calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-scrolling .shine{animation:scrolling-sn calc(4s / var(--speed, 1)) steps(1) infinite} #clawd-scrolling .hrt{transform-origin:50% 50%;opacity:0;animation:scrolling-ht calc(4s / var(--speed, 1)) ease-out infinite} @keyframes scrolling-th{0%,9%,15%,34%,40%,59%,65%,84%,90%,100%{transform:translate(-3px,2px)}12%,37%,62%,87%{transform:translate(-3px,1px)}} @keyframes scrolling-br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.97)}} @keyframes scrolling-sn{0%{opacity:.08}12%{opacity:.16}37%{opacity:.1}62%{opacity:.18}87%{opacity:.08}} @keyframes scrolling-ht{0%,63%{opacity:0;transform:translate(0,0) scale(.4)}67%{opacity:1;transform:translate(0,-1px) scale(1.2)}72%{transform:translate(0,-2px) scale(1)}84%{opacity:1;transform:translate(0,-4px) scale(1)}92%,100%{opacity:0;transform:translate(0,-5px) scale(1)}} #clawd-scrolling .enter{transform-origin:50% 100%;animation:scrolling-in .4s ease-out both} #clawd-scrolling .pin{transform-origin:50% 50%;animation:scrolling-pin .45s ease-out both} @keyframes scrolling-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes scrolling-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}} #clawd-scrolling .look{animation:scrolling-a0 450ms ease-out both} @keyframes scrolling-a0{from{transform:none}to{transform:translateY(1px)}} #clawd-scrolling .armL{animation:scrolling-a1 450ms ease-out both} @keyframes scrolling-a1{from{transform:none}to{transform:translate(3px,2px)}}</style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><g class="hrt"><rect x="22" y="9" width="1" height="1" fill="#E5484D"/><rect x="24" y="9" width="1" height="1" fill="#E5484D"/><rect x="22" y="10" width="3" height="1" fill="#E5484D"/><rect x="23" y="11" width="1" height="1" fill="#E5484D"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> <g class="pin"><rect x="11" y="13" width="10" height="2" fill="#8CCFF0" class="shine" opacity="0"/> <g class="phone"><rect x="14" y="15" width="4" height="4" fill="#2E2C2B"/><rect x="15" y="16" width="1" height="1" fill="#5C5A57"/></g></g> </g></g> </g> </g></g></g></svg>