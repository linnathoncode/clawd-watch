<svg id="clawd-listening" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd listening"><style>#clawd-listening *{transform-box:fill-box} #clawd-listening .squash,#clawd-listening .tilt,#clawd-listening .jumper{transform-origin:50% 100%} #clawd-listening .leg{transform-origin:50% 0%} #clawd-listening .blink,#clawd-listening .look,#clawd-listening .flip,#clawd-listening .shadowg,#clawd-listening .fxc{transform-origin:50% 50%} #clawd-listening .armL{transform-origin:100% 50%} #clawd-listening .armR{transform-origin:0% 50%} #clawd-listening .eyes-h,#clawd-listening .eyes-c,#clawd-listening .eyes-w,#clawd-listening .eyes-s{opacity:0} #clawd-listening .eyes-n{opacity:0} #clawd-listening .eyes-c{opacity:1} #clawd-listening .tilt{transform-origin:50% 100%;animation:listening-hb calc(1s / var(--speed, 1)) ease-in-out infinite} #clawd-listening .jumper{animation:listening-bp calc(0.5s / var(--speed, 1)) ease-in-out infinite} #clawd-listening .squash{animation:listening-sq calc(0.5s / var(--speed, 1)) ease-in-out infinite} #clawd-listening .look{animation:listening-lk calc(1s / var(--speed, 1)) ease-in-out infinite} #clawd-listening .armL{animation:listening-ear calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-listening .armR{animation:listening-tap calc(0.5s / var(--speed, 1)) steps(1) infinite} #clawd-listening .l4{animation:listening-ft calc(0.5s / var(--speed, 1)) steps(1) infinite} #clawd-listening .shadowg{animation:listening-sh calc(0.5s / var(--speed, 1)) ease-in-out infinite} #clawd-listening .eyes-c{animation:listening-ec calc(4s / var(--speed, 1)) steps(1) infinite} #clawd-listening .eyes-h{animation:listening-eh calc(4s / var(--speed, 1)) steps(1) infinite} #clawd-listening .mn{opacity:0;animation:listening-mn calc(2.4s / var(--speed, 1)) ease-out infinite} #clawd-listening .m1{animation-delay:calc(0.8s / var(--speed, 1))} #clawd-listening .m2{animation-delay:calc(1.6s / var(--speed, 1))} @keyframes listening-hb{0%{transform:rotate(0);animation-timing-function:ease-out}25%{transform:rotate(-7deg);animation-timing-function:ease-in-out}75%{transform:rotate(7deg);animation-timing-function:ease-in}100%{transform:rotate(0)}} @keyframes listening-bp{0%,30%,100%{transform:translateY(0)}60%{transform:translateY(-1px)}} @keyframes listening-sq{0%,100%{transform:scale(1,1)}20%{transform:scale(1.04,.94)}60%{transform:scale(.98,1.04)}} @keyframes listening-lk{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}} @keyframes listening-ear{0%,55%,85%,100%{transform:translate(0,0)}62%,78%{transform:translate(1px,-3px)}} @keyframes listening-tap{0%{transform:translateY(0)}50%{transform:translateY(-1px)}} @keyframes listening-ft{0%{transform:translateY(0)}50%{transform:translateY(-1px)}} @keyframes listening-sh{0%,30%,100%{transform:scaleX(1)}60%{transform:scaleX(.9)}} @keyframes listening-ec{0%,59.9%,80%,100%{opacity:1}60%,79.9%{opacity:0}} @keyframes listening-eh{0%,59.9%,80%,100%{opacity:0}60%,79.9%{opacity:1}} @keyframes listening-mn{0%{opacity:0;transform:translate(0,3px) rotate(0)}15%{opacity:1}50%{transform:translate(var(--dx),-2px) rotate(-10deg)}80%{opacity:1}100%{opacity:0;transform:translate(0,-6px) rotate(10deg)}} #clawd-listening .enter{transform-origin:50% 100%;animation:listening-in .4s ease-out both} #clawd-listening .pin{transform-origin:50% 50%;animation:listening-pin .45s ease-out both} @keyframes listening-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes listening-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}} </style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><g class="mn m0" style="--dx:3px"><rect x="24" y="3" width="1" height="4" fill="#D97757"/><rect x="25" y="3" width="1" height="1" fill="#D97757"/><rect x="26" y="4" width="1" height="1" fill="#D97757"/><rect x="23" y="6" width="2" height="2" fill="#D97757"/></g><g class="mn m1" style="--dx:-3px"><rect x="6" y="5" width="1" height="4" fill="#4FB3A9"/><rect x="7" y="5" width="1" height="1" fill="#4FB3A9"/><rect x="8" y="6" width="1" height="1" fill="#4FB3A9"/><rect x="5" y="8" width="2" height="2" fill="#4FB3A9"/></g><g class="mn m2" style="--dx:2px"><rect x="26" y="6" width="1" height="4" fill="#8E7CC3"/><rect x="27" y="6" width="1" height="1" fill="#8E7CC3"/><rect x="28" y="7" width="1" height="1" fill="#8E7CC3"/><rect x="25" y="9" width="2" height="2" fill="#8E7CC3"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> <g class="pin"><g class="headset"><rect x="12" y="8" width="8" height="1" fill="#3B4148"/><rect x="11" y="9" width="1" height="1" fill="#3B4148"/><rect x="20" y="9" width="1" height="1" fill="#3B4148"/> <rect x="10" y="10" width="2" height="3" fill="#2A2E33"/><rect x="20" y="10" width="2" height="3" fill="#2A2E33"/><rect x="10" y="10" width="2" height="1" fill="#545C65"/><rect x="20" y="10" width="2" height="1" fill="#545C65"/></g></g> </g></g> </g> </g></g></g></svg>