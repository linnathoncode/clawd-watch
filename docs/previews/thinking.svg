<svg id="clawd-thinking" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd thinking"><style>#clawd-thinking *{transform-box:fill-box} #clawd-thinking .squash,#clawd-thinking .tilt,#clawd-thinking .jumper{transform-origin:50% 100%} #clawd-thinking .leg{transform-origin:50% 0%} #clawd-thinking .blink,#clawd-thinking .look,#clawd-thinking .flip,#clawd-thinking .shadowg,#clawd-thinking .fxc{transform-origin:50% 50%} #clawd-thinking .armL{transform-origin:100% 50%} #clawd-thinking .armR{transform-origin:0% 50%} #clawd-thinking .eyes-h,#clawd-thinking .eyes-c,#clawd-thinking .eyes-w,#clawd-thinking .eyes-s{opacity:0} #clawd-thinking .blink{animation:thinking-bk calc(3.4s / var(--speed, 1)) infinite} @keyframes thinking-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-thinking .jumper{animation:thinking-bob calc(1.6s / var(--speed, 1)) ease-in-out infinite} #clawd-thinking .look{transform:translate(1px,-1px)} #clawd-thinking .tilt{animation:thinking-tl calc(4.8s / var(--speed, 1)) ease-in-out infinite} #clawd-thinking .armR{animation:thinking-chin calc(1.2s / var(--speed, 1)) ease-in-out infinite} #clawd-thinking .t0{animation:thinking-a calc(3.6s / var(--speed, 1)) infinite} #clawd-thinking .t1{animation:thinking-b calc(3.6s / var(--speed, 1)) infinite} #clawd-thinking .cloud{transform-origin:0% 100%;animation:thinking-c calc(3.6s / var(--speed, 1)) infinite} #clawd-thinking .cd{animation:thinking-d calc(0.9s / var(--speed, 1)) infinite} #clawd-thinking .c1{animation-delay:calc(0.3s / var(--speed, 1))} #clawd-thinking .c2{animation-delay:calc(0.6s / var(--speed, 1))} @keyframes thinking-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}} @keyframes thinking-tl{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}} @keyframes thinking-chin{0%,100%{transform:translate(-1px,-2px)}50%{transform:translate(-1px,-3px)}} @keyframes thinking-a{0%,6%{opacity:0}10%,90%{opacity:1}96%,100%{opacity:0}} @keyframes thinking-b{0%,16%{opacity:0}20%,90%{opacity:1}96%,100%{opacity:0}} @keyframes thinking-c{0%,26%{opacity:0;transform:scale(.4)}34%{opacity:1;transform:scale(1.12)}40%,90%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}} @keyframes thinking-d{0%,100%{opacity:.25}33%{opacity:1}} #clawd-thinking .enter{transform-origin:50% 100%;animation:thinking-in .4s ease-out both} #clawd-thinking .pin{transform-origin:50% 50%;animation:thinking-pin .45s ease-out both} @keyframes thinking-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes thinking-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}} #clawd-thinking .look{animation:thinking-a0 450ms ease-out both} @keyframes thinking-a0{from{transform:none}to{transform:translate(1px,-1px)}}</style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><rect x="23" y="8" width="1" height="1" fill="#F6F2EC" class="t0"/><rect x="24" y="6" width="2" height="1" fill="#F6F2EC" class="t1"/> <g class="cloud"><rect x="26" y="0" width="5" height="1" fill="#F6F2EC"/><rect x="25" y="1" width="7" height="3" fill="#F6F2EC"/><rect x="26" y="4" width="5" height="1" fill="#F6F2EC"/> <rect x="26" y="2" width="1" height="1" fill="#1F1E1D" class="cd c0"/><rect x="28" y="2" width="1" height="1" fill="#1F1E1D" class="cd c1"/><rect x="30" y="2" width="1" height="1" fill="#1F1E1D" class="cd c2"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> </g></g> </g> </g></g></g></svg>