<svg id="clawd-wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd waving"><style>#clawd-wave *{transform-box:fill-box} #clawd-wave .squash,#clawd-wave .tilt,#clawd-wave .jumper{transform-origin:50% 100%} #clawd-wave .leg{transform-origin:50% 0%} #clawd-wave .blink,#clawd-wave .look,#clawd-wave .flip,#clawd-wave .shadowg,#clawd-wave .fxc{transform-origin:50% 50%} #clawd-wave .armL{transform-origin:100% 50%} #clawd-wave .armR{transform-origin:0% 50%} #clawd-wave .eyes-h,#clawd-wave .eyes-c,#clawd-wave .eyes-w,#clawd-wave .eyes-s{opacity:0} #clawd-wave .blink{animation:wave-bk calc(3s / var(--speed, 1)) infinite} @keyframes wave-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-wave .armR{transform-origin:0% 100%;animation:wave-wv calc(3s / var(--speed, 1)) ease-in-out infinite} #clawd-wave .tilt{animation:wave-tl calc(3s / var(--speed, 1)) ease-in-out infinite} #clawd-wave .jumper{animation:wave-hp calc(3s / var(--speed, 1)) infinite} #clawd-wave .eyes-n{animation:wave-en calc(3s / var(--speed, 1)) steps(1) infinite} #clawd-wave .eyes-h{animation:wave-eh calc(3s / var(--speed, 1)) steps(1) infinite} #clawd-wave .spk{transform-origin:50% 50%;opacity:0;animation:wave-sp calc(3s / var(--speed, 1)) ease-out infinite} @keyframes wave-wv{0%,52%,100%{transform:translate(0,0) rotate(0)}8%{transform:translate(0,-4px) rotate(-25deg)}16%,32%{transform:translate(0,-4px) rotate(20deg)}24%,40%{transform:translate(0,-4px) rotate(-25deg)}46%{transform:translate(0,-4px) rotate(0)}} @keyframes wave-tl{0%,52%,100%{transform:rotate(0)}8%,46%{transform:rotate(-5deg)}} @keyframes wave-hp{0%,54%,66%,100%{transform:translateY(0)}60%{transform:translateY(-2px)}} @keyframes wave-en{0%,4.9%{opacity:1}5%,49.9%{opacity:0}50%,100%{opacity:1}} @keyframes wave-eh{0%,4.9%{opacity:0}5%,49.9%{opacity:1}50%,100%{opacity:0}} @keyframes wave-sp{0%,8%{opacity:0;transform:scale(0) rotate(0)}18%{opacity:1;transform:scale(1.1) rotate(45deg)}30%{opacity:1;transform:scale(.8) rotate(90deg)}42%,100%{opacity:0;transform:scale(0) rotate(135deg)}} #clawd-wave .enter{transform-origin:50% 100%;animation:wave-in .4s ease-out both} #clawd-wave .pin{transform-origin:50% 50%;animation:wave-pin .45s ease-out both} @keyframes wave-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes wave-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}}</style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><g class="spk"><rect x="27" y="4" width="1" height="5" fill="#F2C14E"/><rect x="25" y="6" width="5" height="1" fill="#F2C14E"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> </g></g> </g> </g></g></g></svg>