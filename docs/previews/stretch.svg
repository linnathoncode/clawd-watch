<svg id="clawd-stretch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd stretching"><style>#clawd-stretch *{transform-box:fill-box} #clawd-stretch .squash,#clawd-stretch .tilt,#clawd-stretch .jumper{transform-origin:50% 100%} #clawd-stretch .leg{transform-origin:50% 0%} #clawd-stretch .blink,#clawd-stretch .look,#clawd-stretch .flip,#clawd-stretch .shadowg,#clawd-stretch .fxc{transform-origin:50% 50%} #clawd-stretch .armL{transform-origin:100% 50%} #clawd-stretch .armR{transform-origin:0% 50%} #clawd-stretch .eyes-h,#clawd-stretch .eyes-c,#clawd-stretch .eyes-w,#clawd-stretch .eyes-s{opacity:0} #clawd-stretch .blink{animation:stretch-bk calc(4s / var(--speed, 1)) infinite} @keyframes stretch-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-stretch .glow{animation:stretch-gw calc(1.1s / var(--speed, 1)) steps(2) infinite} @keyframes stretch-gw{0%{opacity:.12}50%{opacity:.24}100%{opacity:.16}} #clawd-stretch .armL{animation:stretch-al calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-stretch .armR{animation:stretch-ar calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-stretch .squash{animation:stretch-sq calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-stretch .jumper{animation:stretch-jp calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-stretch .tilt{animation:stretch-tl calc(4s / var(--speed, 1)) ease-in-out infinite} #clawd-stretch .eyes-n{animation:stretch-en calc(4s / var(--speed, 1)) steps(1) infinite} #clawd-stretch .eyes-c{animation:stretch-ec calc(4s / var(--speed, 1)) steps(1) infinite} @keyframes stretch-al{0%,8%,62%,100%{transform:translate(0,0)}22%,48%{transform:translate(1px,-4px)}35%{transform:translate(1px,-5px)}} @keyframes stretch-ar{0%,8%,62%,100%{transform:translate(0,0)}22%,48%{transform:translate(-1px,-4px)}35%{transform:translate(-1px,-5px)}} @keyframes stretch-sq{0%,8%,62%,100%{transform:scale(1,1)}22%,48%{transform:scale(.94,1.1)}35%{transform:scale(.92,1.13)}} @keyframes stretch-jp{0%,8%,62%,100%{transform:translateY(0)}22%,48%{transform:translateY(-1px)}} @keyframes stretch-tl{0%,60%,94%,100%{transform:rotate(0)}70%{transform:rotate(-6deg)}82%{transform:rotate(6deg)}} @keyframes stretch-en{0%,17.9%{opacity:1}18%,55.9%{opacity:0}56%,100%{opacity:1}} @keyframes stretch-ec{0%,17.9%{opacity:0}18%,55.9%{opacity:1}56%,100%{opacity:0}} #clawd-stretch .enter{transform-origin:50% 100%;animation:stretch-in .4s ease-out both} #clawd-stretch .pin{transform-origin:50% 50%;animation:stretch-pin .45s ease-out both} @keyframes stretch-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes stretch-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}} </style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> <g class="pin"><rect x="11" y="10" width="10" height="4" fill="#8CCFF0" class="glow" opacity="0"/></g> </g></g> </g> <g class="pin"><g class="laptop"><rect x="11" y="14" width="10" height="3" fill="#8A939C"/><rect x="11" y="14" width="10" height="1" fill="#A9B2BA"/><rect x="15" y="15" width="2" height="1" fill="#D5DCE2" class="logo"/><rect x="8" y="17" width="16" height="1" fill="#6B747D"/><rect x="8" y="17" width="16" height="1" fill="#000" opacity=".15"/></g></g> </g></g></g></svg>