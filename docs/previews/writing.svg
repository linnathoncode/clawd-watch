<svg id="clawd-writing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd writing"><style>#clawd-writing *{transform-box:fill-box} #clawd-writing .squash,#clawd-writing .tilt,#clawd-writing .jumper{transform-origin:50% 100%} #clawd-writing .leg{transform-origin:50% 0%} #clawd-writing .blink,#clawd-writing .look,#clawd-writing .flip,#clawd-writing .shadowg,#clawd-writing .fxc{transform-origin:50% 50%} #clawd-writing .armL{transform-origin:100% 50%} #clawd-writing .armR{transform-origin:0% 50%} #clawd-writing .eyes-h,#clawd-writing .eyes-c,#clawd-writing .eyes-w,#clawd-writing .eyes-s{opacity:0} #clawd-writing .blink{animation:writing-bk calc(3.4s / var(--speed, 1)) infinite} @keyframes writing-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-writing .armL{animation:writing-ty calc(0.22s / var(--speed, 1)) steps(1) infinite} #clawd-writing .armR{animation:writing-ty2 calc(0.22s / var(--speed, 1)) steps(1) infinite;animation-delay:calc(0.11s / var(--speed, 1))} #clawd-writing .jumper{animation:writing-bn calc(0.44s / var(--speed, 1)) ease-in-out infinite} #clawd-writing .look{animation:writing-lk calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-writing .tilt{animation:writing-tl calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-writing .glow{animation:writing-gw calc(1.1s / var(--speed, 1)) steps(2) infinite} @keyframes writing-gw{0%{opacity:.12}50%{opacity:.24}100%{opacity:.16}} #clawd-writing .code{opacity:0;animation:writing-cd calc(1.8s / var(--speed, 1)) ease-out infinite} #clawd-writing .k1{animation-delay:calc(0.6s / var(--speed, 1))} #clawd-writing .k2{animation-delay:calc(1.2s / var(--speed, 1))} @keyframes writing-ty{0%{transform:translate(0,0)}50%{transform:translate(1px,1px)}} @keyframes writing-ty2{0%{transform:translate(0,0)}50%{transform:translate(-1px,1px)}} @keyframes writing-bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5px)}} @keyframes writing-lk{0%,68%,86%,100%{transform:translateY(0)}72%,82%{transform:translate(1px,-1px)}} @keyframes writing-tl{0%,68%,86%,100%{transform:rotate(0)}72%,82%{transform:rotate(-3deg)}} @keyframes writing-cd{0%{opacity:0;transform:translate(0,11px)}15%{opacity:1}80%{opacity:1;transform:translate(0,3px)}100%{opacity:0;transform:translate(0,1px)}} #clawd-writing .enter{transform-origin:50% 100%;animation:writing-in .4s ease-out both} #clawd-writing .pin{transform-origin:50% 50%;animation:writing-pin .45s ease-out both} @keyframes writing-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes writing-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}} </style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="pin"><g class="code k0" transform="translate(0 11)"><rect x="25" y="0" width="1" height="1" fill="#D97757"/><rect x="24" y="1" width="1" height="1" fill="#D97757"/><rect x="25" y="2" width="1" height="1" fill="#D97757"/></g><g class="code k1" transform="translate(0 11)"><rect x="28" y="0" width="1" height="1" fill="#D97757"/><rect x="28" y="1" width="1" height="1" fill="#D97757"/><rect x="27" y="2" width="1" height="1" fill="#D97757"/></g><g class="code k2" transform="translate(0 11)"><rect x="29" y="0" width="1" height="1" fill="#D97757"/><rect x="30" y="1" width="1" height="1" fill="#D97757"/><rect x="29" y="2" width="1" height="1" fill="#D97757"/></g></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> <g class="pin"><rect x="11" y="10" width="10" height="4" fill="#8CCFF0" class="glow" opacity="0"/></g> </g></g> </g> <g class="pin"><g class="laptop"><rect x="11" y="14" width="10" height="3" fill="#8A939C"/><rect x="11" y="14" width="10" height="1" fill="#A9B2BA"/><rect x="15" y="15" width="2" height="1" fill="#D5DCE2" class="logo"/><rect x="8" y="17" width="16" height="1" fill="#6B747D"/><rect x="8" y="17" width="16" height="1" fill="#000" opacity=".15"/></g></g> </g></g></g></svg>