<svg id="clawd-searching" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 22" width="128" height="88" shape-rendering="crispEdges" role="img" aria-label="Clawd searching"><style>#clawd-searching *{transform-box:fill-box} #clawd-searching .squash,#clawd-searching .tilt,#clawd-searching .jumper{transform-origin:50% 100%} #clawd-searching .leg{transform-origin:50% 0%} #clawd-searching .blink,#clawd-searching .look,#clawd-searching .flip,#clawd-searching .shadowg,#clawd-searching .fxc{transform-origin:50% 50%} #clawd-searching .armL{transform-origin:100% 50%} #clawd-searching .armR{transform-origin:0% 50%} #clawd-searching .eyes-h,#clawd-searching .eyes-c,#clawd-searching .eyes-w,#clawd-searching .eyes-s{opacity:0} #clawd-searching .blink{animation:searching-bk calc(3.3s / var(--speed, 1)) infinite} @keyframes searching-bk{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.1)}} #clawd-searching .mover{animation:searching-mv calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-searching .leg{animation:searching-lg calc(5s / var(--speed, 1)) infinite} #clawd-searching .tilt{animation:searching-ln calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-searching .squash{animation:searching-sq calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-searching .armR{animation:searching-ar calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-searching .mag{animation:searching-mg calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-searching .bigeye{transform-origin:50% 50%;animation:searching-be calc(5s / var(--speed, 1)) infinite} #clawd-searching .glint{animation:searching-gl calc(1.2s / var(--speed, 1)) steps(1) infinite} #clawd-searching .look{animation:searching-lk calc(5s / var(--speed, 1)) ease-in-out infinite} #clawd-searching .eyes-n{animation:searching-en calc(5s / var(--speed, 1)) steps(1) infinite} #clawd-searching .eyes-s{animation:searching-es calc(5s / var(--speed, 1)) steps(1) infinite} @keyframes searching-mv{0%,96%,100%{transform:translateX(0)}32%,66%{transform:translateX(4px)}} @keyframes searching-lg{0%,4%,8%,12%,16%,20%,24%,28%,68%,72%,76%,80%,84%,88%,92%{transform:scaleY(1)}2%,6%,10%,14%,18%,22%,26%,30%,70%,74%,78%,82%,86%,90%,94%{transform:scaleY(.5)}32%,66%,96%,100%{transform:scaleY(1)}} @keyframes searching-ln{0%,30%,68%,100%{transform:rotate(0)}36%,62%{transform:rotate(5deg)}} @keyframes searching-sq{0%,30%,68%,100%{transform:scale(1,1)}36%{transform:scale(1.04,.95)}44%,58%{transform:scale(.98,1.04)}64%{transform:scale(1,1)}} @keyframes searching-ar{0%,36%,64%,100%{transform:translate(-1px,-1px)}42%,58%{transform:translate(-4px,-1px)}} @keyframes searching-mg{0%,100%{transform:translate(0,0)}8%,24%{transform:translate(0,-1px)}16%{transform:translate(0,0)}36%{transform:translate(0,0)}42%,58%{transform:translate(-7px,1px)}64%{transform:translate(0,0)}76%,92%{transform:translate(0,-1px)}84%{transform:translate(0,0)}} @keyframes searching-be{0%,41.9%{opacity:0;transform:scale(.6)}42%{opacity:1;transform:scale(.6)}46%{transform:scale(1.25)}50%{transform:scale(1.05)}54%{transform:scale(1.2)}58%{opacity:1;transform:scale(1)}58.1%,100%{opacity:0}} @keyframes searching-gl{0%{opacity:1}50%{opacity:0}} @keyframes searching-lk{0%,30%,68%,100%{transform:translateX(1px)}36%,62%{transform:translate(1px,1px)}} @keyframes searching-en{0%,41.9%{opacity:1}42%,57.9%{opacity:0}58%,100%{opacity:1}} @keyframes searching-es{0%,41.9%{opacity:0}42%,57.9%{opacity:1}58%,100%{opacity:0}} #clawd-searching .enter{transform-origin:50% 100%;animation:searching-in .4s ease-out both} #clawd-searching .pin{transform-origin:50% 50%;animation:searching-pin .45s ease-out both} @keyframes searching-in{0%{transform:scale(1.08,.88)}45%{transform:scale(.96,1.05)}100%{transform:none}} @keyframes searching-pin{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:none}}</style><rect x="0" y="0" width="32" height="22" rx="2" fill="#F4EFE8"/><g class="enter"> <g class="mover"><g class="flip"> <g class="shadowg"><rect x="11" y="18" width="10" height="1" fill="#000" opacity=".22"/></g> <g class="jumper"> <g class="squash"><g class="tilt"> <g class="legs"><g class="leg l1"><rect x="12" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l2"><rect x="14" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l3"><rect x="17" y="16" width="1" height="2" fill="#B45A3C"/></g><g class="leg l4"><rect x="19" y="16" width="1" height="2" fill="#B45A3C"/></g></g> <rect x="11" y="10" width="10" height="6" fill="#D97757"/><rect x="11" y="10" width="10" height="1" fill="#EE9C80"/><rect x="12" y="11" width="1" height="1" fill="#EE9C80"/><rect x="11" y="15" width="10" height="1" fill="#B45A3C"/> <g class="armL"><rect x="9" y="13" width="2" height="2" fill="#D97757"/><rect x="9" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="armR"><rect x="21" y="13" width="2" height="2" fill="#D97757"/><rect x="21" y="14" width="2" height="1" fill="#B45A3C"/></g> <g class="face"><g class="look"> <g class="eyes-n"><g class="blink"><rect x="13" y="12" width="1" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="2" fill="#1F1E1D"/></g></g> <g class="eyes-h"><rect x="12" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="13" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="14" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="17" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="12" width="1" height="1" fill="#1F1E1D"/><rect x="19" y="13" width="1" height="1" fill="#1F1E1D"/></g> <g class="eyes-c"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/><rect x="18" y="13" width="2" height="1" fill="#1F1E1D"/></g> <g class="eyes-w"><rect x="12" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="18" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="12" width="1" height="1" fill="#FFF"/><rect x="18" y="12" width="1" height="1" fill="#FFF"/></g> <g class="eyes-s"><rect x="12" y="13" width="2" height="1" fill="#1F1E1D"/></g> </g></g> <g class="pin"><g class="mag"><rect x="24" y="9" width="3" height="1" fill="#1F1E1D"/><rect x="23" y="10" width="1" height="3" fill="#1F1E1D"/><rect x="27" y="10" width="1" height="3" fill="#1F1E1D"/><rect x="24" y="13" width="3" height="1" fill="#1F1E1D"/><rect x="24" y="10" width="3" height="3" fill="#8CCFF0" opacity=".55"/> <g class="bigeye"><rect x="24" y="10" width="3" height="3" fill="#1F1E1D"/><rect x="24" y="10" width="1" height="1" fill="#FFF"/><rect x="25" y="11" width="1" height="1" fill="#3A3836"/></g> <rect x="24" y="10" width="1" height="1" fill="#FFF" class="glint"/><rect x="22" y="13" width="1" height="1" fill="#1F1E1D"/><rect x="21" y="14" width="1" height="1" fill="#1F1E1D"/></g></g> </g></g> </g> </g></g></g></svg>